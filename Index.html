<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Souvent fâché et pas facho</title>
<style>
:root{--rouge:#d1382c;--noir:#111;--jaune:#ffd200;--blanc:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--blanc);color:var(--noir);font-family:Helvetica,Arial,sans-serif}
header{background:var(--rouge);display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:4px solid var(--noir)}
header img{height:56px;width:56px}
header h1{margin:0;font:900 1.3rem Impact,"Arial Black",sans-serif;color:var(--noir)}
main{max-width:720px;margin:0 auto;padding:16px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.nav h2{margin:0;font-size:1.3rem;text-transform:capitalize}
button{background:var(--noir);color:var(--jaune);border:0;padding:10px 16px;font-size:1rem;font-weight:700;border-radius:6px}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.jour-nom{text-align:center;font-weight:700;padding:6px 0;background:var(--noir);color:var(--blanc);border-radius:4px;font-size:.8rem}
.case{aspect-ratio:1;border:2px solid var(--noir);border-radius:6px;padding:4px;font-weight:700}
.case.vide{border:0}
.case.aujourdhui{background:var(--jaune)}
</style>
</head>
<body>
<header><img src="logo.png" alt="DIDF Jeunes"><h1>Souvent fâché et pas facho</h1></header>
<main>
<div class="nav"><button id="prec">Précédent</button><h2 id="titre"></h2><button id="suiv">Suivant</button></div>
<div class="grille" id="grille"></div>
</main>
<script>
let d=new Date();d.setDate(1);
const jours=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
function afficher(){
 const g=document.getElementById("grille");g.innerHTML="";
 document.getElementById("titre").textContent=d.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
 jours.forEach(j=>{g.innerHTML+=`<div class="jour-nom">${j}</div>`});
 const decal=(d.getDay()+6)%7;
 for(let i=0;i<decal;i++)g.innerHTML+='<div class="case vide"></div>';
 const nb=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 const a=new Date();
 for(let n=1;n<=nb;n++){
  const est=n===a.getDate()&&d.getMonth()===a.getMonth()&&d.getFullYear()===a.getFullYear();
  g.innerHTML+=`<div class="case${est?" aujourdhui":""}">${n}</div>`;
 }
}
document.getElementById("prec").onclick=()=>{d.setMonth(d.getMonth()-1);afficher()};
document.getElementById("suiv").onclick=()=>{d.setMonth(d.getMonth()+1);afficher()};
afficher();
</script>
</body>
</html>
